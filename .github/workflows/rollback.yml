name: Roll Back Relay

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable GHCR image reference (tag or digest)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Configure deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Roll back relay
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_REF='$IMAGE_REF' bash -s" <<'REMOTE'
          set -euo pipefail
          docker pull "$IMAGE_REF"
          printf 'RELAY_IMAGE_REF=%s\n' "$IMAGE_REF" > /opt/opencode-notify/release.env
          docker compose \
            --project-name opencode-notify \
            --env-file /opt/opencode-notify/nomlihost.env \
            --env-file /opt/opencode-notify/release.env \
            -f /opt/opencode-notify/compose.nomlihost.yml \
            up -d --no-build --force-recreate --wait --wait-timeout 120 relay
          REMOTE

      - name: Verify public readiness
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 3 https://relay.nomli-com.ru/health/ready
