name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @nomli/opencode-notify to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm ci

      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: Publish
        working-directory: packages/opencode-plugin
        run: |
          set -e
          echo "::group::npm publish --provenance"
          npm publish --provenance
          echo "::endgroup::"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published package
        working-directory: packages/opencode-plugin
        run: npm view @nomli/opencode-notify version dist.tarball
