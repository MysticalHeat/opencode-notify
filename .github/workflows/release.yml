name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-server-image:
    name: Publish relay server image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/mysticalheat/opencode-notify-server:release-${{ github.event.release.tag_name }}
            ghcr.io/mysticalheat/opencode-notify-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/MysticalHeat/opencode-notify
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
