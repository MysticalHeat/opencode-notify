name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build & Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Pack dry-run (plugin package)
        working-directory: packages/opencode-plugin
        run: npm pack --dry-run

      - name: Check package.json for private packages
        run: |
          set -e
          find packages apps -name package.json -maxdepth 2 | while read -r f; do
            echo "=== $f ==="
            node -e "
              const p = require('./$f');
              if (!p.name) { console.error('ERROR: missing name'); process.exit(1); }
              if (p.private && !p.name.startsWith('@repo/')) {
                console.warn('WARN: private package does not use @repo/ scope: ' + p.name);
              }
              if (!p.private && (!p.files || p.files.length === 0)) {
                console.warn('WARN: public package has no files field: ' + p.name);
              }
              console.log('OK: ' + p.name + ' private=' + p.private);
            " || exit 1
          done

      - name: Validate workflow files
        run: node scripts/validate-workflows.mjs

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test
        run: bash scripts/docker-smoke.sh
